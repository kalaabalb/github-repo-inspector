name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API test suite
        env:
          PYTHONPATH: api
        run: python -m pytest
      - name: CLI smoke test (offline folder analysis)
        working-directory: api
        env:
          PYTHONPATH: .
        run: |
          python -m app.cli inspect .. -f markdown -o "$RUNNER_TEMP/report.md"
          python -m app.cli sample -f json > /dev/null
          test -s "$RUNNER_TEMP/report.md"

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - name: Install client dependencies
        working-directory: client
        run: flutter pub get
      - name: Analyze client
        working-directory: client
        run: flutter analyze
      - name: Run client tests
        working-directory: client
        run: flutter test
      - name: Build offline-ready Web client
        working-directory: client
        run: flutter build web --release --no-web-resources-cdn
